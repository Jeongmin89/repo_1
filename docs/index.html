<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FEE500">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>사진설명톡</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:#e5e5ea;--kakao:#FEE500;--kakao-text:#191919;--ok:#1a7f37;--err:#c62828}
  @media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--muted:#98989d;--line:#38383a}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
       padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
  main{max-width:560px;margin:0 auto}
  h1{font-size:22px;margin:8px 0 16px;display:flex;align-items:center;gap:8px}
  h1 img{width:32px;height:32px}
  .card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .muted{color:var(--muted);font-size:14px}
  button{font:inherit;border:0;border-radius:12px;padding:14px 16px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.5}
  .primary{background:var(--kakao);color:var(--kakao-text);width:100%}
  .ghost{background:transparent;color:var(--muted);padding:8px;font-weight:500}
  .pick{display:block;border:2px dashed var(--line);border-radius:16px;padding:28px 16px;text-align:center;cursor:pointer}
  .pick input{display:none}
  .pick b{display:block;font-size:18px;margin-bottom:4px}
  label.field{display:block;margin:12px 0 4px;font-size:14px;font-weight:600}
  input[type=text],input[type=password],textarea,select{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
  textarea{min-height:64px;resize:vertical}
  .thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
  .thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
  .result{display:flex;gap:12px;align-items:flex-start;border-top:1px solid var(--line);padding:12px 0}
  .result:first-child{border-top:0}
  .result img{width:64px;height:64px;object-fit:cover;border-radius:8px;flex:none}
  .result .body{flex:1;min-width:0}
  .result pre{white-space:pre-wrap;word-break:break-word;margin:4px 0 0;font:inherit;font-size:14px}
  .status{font-size:13px;font-weight:700}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  .badge{font-size:13px;padding:4px 10px;border-radius:99px;background:var(--bg)}
  details summary{cursor:pointer;font-weight:700}
  .hidden{display:none}
</style>
</head>
<body>
<main>
  <h1><img src="icon.svg" alt="">사진설명톡</h1>

  <!-- 카카오 연결 상태 -->
  <section class="card row">
    <span id="kakaoStatus" class="badge">카카오톡 확인 중…</span>
    <span>
      <button id="kakaoLogin" class="ghost hidden">카카오 연결</button>
      <button id="kakaoLogout" class="ghost hidden">연결 해제</button>
    </span>
  </section>

  <!-- 사진 선택 + 전송 -->
  <section class="card">
    <label class="pick">
      <input id="photos" type="file" accept="image/*" multiple>
      <b>📷 사진 고르기</b>
      <span class="muted">갤러리에서 고르거나 바로 촬영할 수 있어요 (여러 장 가능)</span>
    </label>
    <div id="thumbs" class="thumbs"></div>
    <label class="field" for="note">메모 (선택)</label>
    <textarea id="note" placeholder="예: 제주도 여행 둘째 날"></textarea>
    <button id="send" class="primary" style="margin-top:12px" disabled>설명 만들어서 카카오톡으로 보내기</button>
  </section>

  <!-- 결과 -->
  <section id="resultsCard" class="card hidden">
    <div id="results"></div>
  </section>

  <!-- 설정 -->
  <section class="card">
    <details id="settingsBox">
      <summary>⚙️ 설정</summary>
      <p class="muted">입력한 키는 이 휴대폰 브라우저에만 저장되고, Claude·카카오 서버로만 전송됩니다.</p>
      <label class="field" for="claudeKey">Claude API 키</label>
      <input id="claudeKey" type="password" autocomplete="off" placeholder="sk-ant-...">
      <label class="field" for="model">모델</label>
      <select id="model">
        <option value="claude-opus-5-5">Claude Opus 5.5 — 가장 자세함 (1장 약 40원)</option>
        <option value="claude-sonnet-5-5">Claude Sonnet 5.5 — 중간</option>
        <option value="claude-haiku-5-5">Claude Haiku 5.5 — 가장 저렴 (1장 약 1~2원)</option>
      </select>
      <label class="field" for="kakaoKey">카카오 REST API 키</label>
      <input id="kakaoKey" type="text" autocomplete="off" placeholder="Kakao Developers > 앱 키 > REST API 키">
      <label class="field" for="kakaoSecret">카카오 Client Secret (사용하는 경우만)</label>
      <input id="kakaoSecret" type="password" autocomplete="off" placeholder="비워두면 사용 안 함">
      <p class="muted">카카오 Redirect URI 및 Web 도메인에 등록할 주소:<br><code id="redirectUri"></code></p>
      <button id="saveSettings" class="primary">저장</button>
    </details>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
